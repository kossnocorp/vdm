[package]
name = "vendorit"
version = "0.1.0"
edition = "2024"
description = "Vendored dependencies manager"
authors = ["Sasha Koss <koss@nocorp.me>"]
license = "MIT"
repository = "https://github.com/kossnocorp/vit"

[[bin]]
name = "vit"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.89"
directories = "6.0.0"
fs2 = "0.4.3"
git2 = { version = "0.20.4", default-features = false, features = ["https"] }
oxc_allocator = "0.146.0"
oxc_ast = "0.146.0"
oxc_ast_visit = "0.146.0"
oxc_parser = "0.146.0"
oxc_resolver = "11.23.0"
oxc_span = "0.146.0"
oxc_syntax = "0.146.0"
reqwest = { version = "0.12.28", features = ["blocking"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.10.9"
tempfile = "3.26.0"
tokio = { version = "1.53.1", features = ["full"] }
toml = "0.9.8"
usage = { package = "usage-rs", version = "6" }
